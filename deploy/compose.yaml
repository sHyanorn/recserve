# Kafka (KRaft, one node) and Valkey for local runs and the integration tests
# (make infra-up). From the host: Kafka at localhost:9094, Valkey at
# localhost:6379; from other containers on this network: kafka:9092, valkey:6379.
#
# The profile "app" adds the service on them, from the images of make images
# (make up DATA=... VERSION=...): ingest, four annshard replicas (two shards of
# two), the gateway, Prometheus, Grafana and Jaeger. DATA is mounted read-only
# at /data and the gateway serves DATA/bundle/VERSION. From the host: the
# gateway at localhost:8080, its admin API at localhost:8081 (swaps take a path
# under /data), Prometheus at localhost:9090, Grafana at localhost:3000, Jaeger
# at localhost:16686. The gateway and the replicas trace every request (D051).
# ingest creates the events topic; until it exists a gateway started with
# -kafka-brokers answers 503 on /v1/events (D034). A gateway that cannot
# prepare its bundle on the replicas exits and is restarted.
name: recserve

services:
  kafka:
    image: apache/kafka:4.4.0@sha256:833b867a9585a141da455dc2b57431c65cbccb27f11c91f694444cca9f777e0f
    ports:
      - "127.0.0.1:9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,HOST://:9094,CONTROLLER://:9093
      # A client is told to reconnect to the address of the listener it came in on.
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # A missing topic is an error, not a new topic with one partition.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms1g -Xmx1g
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 2s
      timeout: 10s
      retries: 30

  valkey:
    image: valkey/valkey:9.1@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7
    # Only keys with a TTL are evicted. The histories have none, so once they
    # fill the memory, writes fail and reads go on (D033).
    command: ["valkey-server", "--maxmemory", "1gb", "--maxmemory-policy", "volatile-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  ingest:
    profiles: [app]
    image: recserve/ingest:${TAG:-dev}
    command: [-kafka-brokers=kafka:9092, -valkey-addr=valkey:6379]
    depends_on:
      kafka: {condition: service_healthy}
      valkey: {condition: service_healthy}
    restart: on-failure

  annshard-0: &annshard
    profiles: [app]
    image: recserve/annshard:${TAG:-dev}
    command: [-bundles=/data/bundle]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: annshard
    volumes:
      - ${DATA:-../data}:/data:ro
    restart: on-failure
  annshard-1: *annshard
  annshard-2: *annshard
  annshard-3: *annshard

  gateway:
    profiles: [app]
    image: recserve/gateway:${TAG:-dev}
    command:
      - -bundle=/data/bundle/${VERSION:-}
      - -test-split=/data/Video_Games.test.csv.gz
      - -preload=/data/Video_Games.train.csv.gz,/data/Video_Games.valid.csv.gz
      - -ort-lib=/usr/local/lib/libonnxruntime.so.1.31.1
      - -valkey-addr=valkey:6379
      - -kafka-brokers=kafka:9092
      - -shard-addrs=annshard-0:9090,annshard-1:9090;annshard-2:9090,annshard-3:9090
      - -admin-addr=:8081
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: gateway
    volumes:
      - ${DATA:-../data}:/data:ro
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    depends_on: [ingest, annshard-0, annshard-1, annshard-2, annshard-3]
    restart: on-failure

  prometheus:
    profiles: [app]
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    volumes:
      - ./prometheus:/etc/prometheus:ro
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    profiles: [app]
    image: grafana/grafana:13.3.1@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"

  jaeger:
    profiles: [app]
    # All in one, spans in memory; OTLP on 4317 inside this network.
    image: jaegertracing/jaeger:2.23.0@sha256:3823829974ccfc2485d2e48b165579091f32295022ae80ca49704e2f4834116e
    ports:
      - "127.0.0.1:16686:16686"
