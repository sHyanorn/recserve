# The replicas: two shards of two, which the gateway names by Pod in
# -shard-addrs (D047).
apiVersion: v1
kind: Service
metadata:
  name: annshard
spec:
  clusterIP: None
  # Only a gateway's Prepare makes a replica ready (D044), so its name must
  # resolve before it is.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: annshard
  ports:
    - name: grpc
      port: 9090
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: annshard
spec:
  serviceName: annshard
  replicas: 4
  # All at once: a replica is ready once a gateway has prepared it, and a
  # gateway starts once every shard has a replica, so OrderedReady creates each
  # next replica only after a gateway's restart: 46 s instead of 4 s (D047).
  podManagementPolicy: Parallel
  minReadySeconds: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: annshard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: annshard
    spec:
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: annshard
          image: recserve/annshard:dev
          imagePullPolicy: IfNotPresent
          args: [-bundles=/data/bundle]
          ports:
            - name: grpc
              containerPort: 9090
          readinessProbe:
            grpc:
              port: 9090
            periodSeconds: 1
          # Not on grpc.health.v1, which reports NOT_SERVING until a gateway has
          # prepared the replica.
          livenessProbe:
            tcpSocket:
              port: grpc
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: data
            readOnly: true
