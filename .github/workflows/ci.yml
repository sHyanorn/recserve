name: ci
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Tests that need ONNX Runtime fail instead of skipping when it is missing.
      RECSERVE_REQUIRE_ORT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: ONNX Runtime 1.31.1
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/ort.tgz" \
            https://github.com/microsoft/onnxruntime/releases/download/v1.31.1/onnxruntime-linux-x64-1.31.1.tgz
          echo "c849e36a1ef3e22d4ff217b9d1ce4a3cf5b9467b975610913ae959ad5b16bdc9  $RUNNER_TEMP/ort.tgz" | sha256sum -c
          tar xzf "$RUNNER_TEMP/ort.tgz" -C "$RUNNER_TEMP"
          echo "RECSERVE_ORT_LIB=$RUNNER_TEMP/onnxruntime-linux-x64-1.31.1/lib/libonnxruntime.so.1.31.1" >> "$GITHUB_ENV"
      - run: go vet ./...
      - run: go test -race ./...

  integration:
    runs-on: ubuntu-latest
    env:
      RECSERVE_VALKEY_ADDR: localhost:6379
      RECSERVE_KAFKA_BROKERS: localhost:9094
      # Tests that need Kafka or Valkey fail instead of skipping when they are missing.
      RECSERVE_REQUIRE_INFRA: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Kafka and Valkey
        run: docker compose -f deploy/compose.yaml up -d --wait --wait-timeout 180
      - run: go test -race ./...
      # The binaries against the services; pauses Valkey and stops Kafka, so it runs after everything else.
      - name: End to end
        run: go test -race -count=1 ./internal/e2e/
        env:
          RECSERVE_E2E: "1"
      - name: Service logs
        if: failure()
        run: docker compose -f deploy/compose.yaml logs --no-color --tail 200

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          version: 1.75.0
          checksum: fad1e38d6909bbb583a4da81d8c02a01046e2cd663bde7e337dd24277393764b
          setup_only: true
      # The committed *.pb.go must be what the proto files generate.
      - run: make proto
      - run: git add --intent-to-add . && git diff --exit-code

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  bundle-tools:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/bundle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.11.32
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make images
      - run: make test-alerts
      - name: kind v0.33.0 and kubectl v1.37.2
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/kind" \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/kubectl" \
            https://dl.k8s.io/release/v1.37.2/bin/linux/amd64/kubectl
          sha256sum -c <<SUMS
          aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  $RUNNER_TEMP/kind
          c04487523e7aa7d1493f7808174c899db93d7a9cf57531420cd76b9bd415f8f4  $RUNNER_TEMP/kubectl
          SUMS
          chmod +x "$RUNNER_TEMP/kind" "$RUNNER_TEMP/kubectl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      # The replicas need no bundle to listen, so an empty data directory will do.
      - name: NetworkPolicy enforced in kind
        run: |
          mkdir -p "$RUNNER_TEMP/data/bundle"
          scripts/kind-cluster.sh "$RUNNER_TEMP/data"
          scripts/kind-netpol.sh
